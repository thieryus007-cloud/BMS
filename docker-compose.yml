# =============================================================================
# DalyBMS — Stack complète Docker Compose
# =============================================================================
# Inclut : Mosquitto · daly-bms-server
#
# Démarrage :
#   docker compose up -d
#   docker compose logs -f dalybms-server
#
# URLs après démarrage :
#   Dashboard  → http://localhost:8000/dashboard
#   API REST   → http://localhost:8000/api/v1/bms
#   WebSocket  → ws://localhost:8000/ws/bms/stream

# =============================================================================
# Services
# =============================================================================
services:

  # ── Broker MQTT ─────────────────────────────────────────────────────────────
  mosquitto:
    image: eclipse-mosquitto:2.0.18
    container_name: dalybms-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./docker/mosquitto/config:/mosquitto/config:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h localhost -t '$$health' -m ok -q 0 && echo ok"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - dalybms-net

  # ── Serveur BMS Rust (mode simulation) ──────────────────────────────────────
  dalybms-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: dalybms-server:latest
    container_name: dalybms-server
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      RUST_LOG:       ${RUST_LOG:-info}
      DALY_CONFIG:    /etc/daly-bms/config.toml
      DALY_API_KEY:   ${DALY_API_KEY:-}
    volumes:
      - ./Config.docker.toml:/etc/daly-bms/config.toml:ro
      - dalybms-alerts:/var/lib/daly-bms
    command: []
    devices:
      - /dev/daly-bms:/dev/ttyUSB0
    depends_on:
      mosquitto:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/system/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - dalybms-net

  # ── Venus OS keepalive ──────────────────────────────────────────────────────
  venus-keepalive:
    image: eclipse-mosquitto:2.0.18
    container_name: dalybms-venus-keepalive
    restart: unless-stopped
    entrypoint: >
      sh -c "while true; do
        mosquitto_pub -h mosquitto -p 1883 -t 'R/c0619ab9929a/keepalive' -m '' -q 0;
        sleep 55;
      done"
    depends_on:
      mosquitto:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "2"
    networks:
      - dalybms-net

# =============================================================================
# Réseau interne
# =============================================================================
networks:
  dalybms-net:
    driver: bridge
    name: dalybms-net

# =============================================================================
# Volumes persistants
# =============================================================================
volumes:
  mosquitto-data:
    name: dalybms-mosquitto-data
  mosquitto-log:
    name: dalybms-mosquitto-log
  dalybms-alerts:
    name: dalybms-alerts
