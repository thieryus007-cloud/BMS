# =============================================================================
# DalyBMS — Rust Edition — Workspace Cargo.toml
# =============================================================================
[workspace]
resolver = "2"
members = [
    "crates/rs485-bus",
    "crates/daly-bms-core",
    "crates/daly-bms-server",
    "crates/dbus-mqtt-venus",
    "crates/energy-manager",
    "crates/metrics-store",
]

[workspace.package]
version     = "0.1.0"
edition     = "2021"
authors     = ["DalyBMS Rust Team"]
license     = "MIT"
rust-version = "1.88"
repository  = "https://github.com/thieryus007-cloud/Daly-BMS-Rust"

# =============================================================================
# Shared dependencies (referenced as { workspace = true } in each crate)
# =============================================================================
[workspace.dependencies]

# ── Crates internes ────────────────────────────────────────────────────────────
rs485-bus     = { path = "crates/rs485-bus" }
metrics-store = { path = "crates/metrics-store" }

# ── Async runtime ─────────────────────────────────────────────────────────────
tokio         = { version = "1",    features = ["full"] }
tokio-serial  = "5.4.5"

# ── Serialisation ─────────────────────────────────────────────────────────────
serde         = { version = "1",    features = ["derive"] }
serde_json    = "1"
toml          = "0.8"

# ── Error handling ─────────────────────────────────────────────────────────────
anyhow        = "1"
thiserror     = "1"

# ── Logging / tracing ──────────────────────────────────────────────────────────
tracing               = "0.1"
tracing-subscriber    = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender      = "0.2"

# ── HTTP server (API + WebSocket) ──────────────────────────────────────────────
axum          = { version = "0.7",  features = ["ws", "macros"] }
tower         = { version = "0.4",  features = ["limit", "timeout"] }
tower-http    = { version = "0.5",  features = ["cors", "trace", "compression-gzip"] }

# ── MQTT ───────────────────────────────────────────────────────────────────────
rumqttc       = "0.25"

# ── SQLite (alertes) ───────────────────────────────────────────────────────────
rusqlite      = { version = "0.31", features = ["bundled"] }

# ── HTTP client (Telegram) ─────────────────────────────────────────────────────
reqwest       = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# ── Email ──────────────────────────────────────────────────────────────────────
lettre        = { version = "0.11", features = ["tokio1-rustls-tls"], default-features = false }

# ── Date/time ──────────────────────────────────────────────────────────────────
chrono        = { version = "0.4",  features = ["serde"] }

# ── CLI ────────────────────────────────────────────────────────────────────────
clap          = { version = "4",    features = ["derive", "color", "env"] }

# ── D-Bus pure Rust (no libdbus-dev — easy ARM cross-compile) ─────────────────
zbus          = { version = "4",    default-features = false, features = ["tokio"] }
zvariant      = { version = "4",    default-features = false }

# ── UUID ───────────────────────────────────────────────────────────────────────
uuid          = { version = "1",    features = ["v4"] }

# ── Misc ───────────────────────────────────────────────────────────────────────
bytes         = "1"
futures       = "0.3"
tokio-util    = { version = "0.7",  features = ["codec"] }

# ── Modbus RTU (ET112 et autres compteurs RS485) ───────────────────────────────
tokio-modbus  = { version = "0.14", features = ["rtu"] }

# ── Rule engine (energy-manager decision logic) ───────────────────────────────
rust-rule-engine = "1.20"

# ── Monitoring ─────────────────────────────────────────────────────────────────
sd-notify     = "0.4"
tokio-metrics = "0.3"

# =============================================================================
# Release profile — optimisé taille + vitesse pour le Pi
# =============================================================================
#[profile.release]
#opt-level     = 3
#lto           = true
#codegen-units = 1
#strip         = true
#panic         = "abort"

#[profile.dev]
#opt-level = 1

# =============================================================================
# Profiles de compilation optimisés
# =============================================================================

[profile.release]
opt-level = 3                    # Optimisations maximales
lto = "fat"                      # Link-Time Optimization (+10-30% perf)
codegen-units = 1                # Meilleure optimisation, compilation plus lente
panic = "abort"                  # Réduit taille, évite unwind tables
strip = "symbols"                # Supprime symboles de debug
debug = false
rpath = false
incremental = false

# Profile pour le profiling avec perf/flamegraph (symboles conservés)
[profile.release-debug]
inherits = "release"
debug = true                     # Garde les symboles pour perf
strip = "none"                   # Ne pas strip pour le profiling
panic = "unwind"                 # Permet backtrace pour debug

# Profile "size" si espace disque critique (optionnel)
[profile.release-size]
inherits = "release"
opt-level = "z"                  # Optimise pour la taille
lto = "thin"                     # LTO plus rapide
