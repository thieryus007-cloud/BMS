# =============================================================================
# DalyBMS — Rust Edition — Configuration principale
# =============================================================================
# Ce fichier est utilisé pour :
#   - Développement Windows (cargo run, BMS réel ou simulateur)
#   - Déploiement natif Linux / Raspberry Pi 5
#
# Pour la stack Docker complète (docker compose up), utiliser Config.docker.toml.
#
# Ordre de chargement :
#   1. Variable d'environnement DALY_CONFIG
#   2. ./Config.toml  (répertoire courant — Windows / dev)
#   3. /etc/daly-bms/config.toml  (Linux production)
# Date de référence : mars 2026

[serial]
# Port série RS485 (USB → /dev/ttyUSB* ou /dev/ttyACM*)
# Sur Linux : /dev/ttyUSB0 ou /dev/ttyUSB1
# Sur Windows : laisser vide pour auto-détection, ou spécifier COM5, COM6...
port = ""   # vide = auto-détection au démarrage (scan ttyUSB*)

# Vitesse de communication (Daly standard = 9600)
baud = 9600

# Intervalle de polling global (en millisecondes)
# 1000 ms = 1 requête par seconde → bon équilibre réactivité / charge CPU
poll_interval_ms = 1000

# Nombre maximum de cellules attendues (utilisé pour parsing multi-trames)
default_cell_count = 16

# Nombre de sondes NTC attendues
default_temp_sensors = 4

# Taille du ring buffer en mémoire (nombre de snapshots conservés)
# 3600 = 1 heure à 1 Hz → bon pour historique court terme + export CSV
ring_buffer_size = 3600

# Activer la découverte automatique au démarrage (sonde 0x01 → 0xFF)
# Recommandé : activer une fois pour détecter, puis passer en manuel
auto_discover = false

# Plage de découverte auto (si activée)
auto_discover_start = 1
auto_discover_end   = 16

# Liste explicite des BMS (recommandé en production)
# Format : "0x01,0x02,0x03" ou tableau TOML ["0x01", "0x02"]
addresses = ["0x01", "0x02", "0x03"]


[api]
# Interface et port d'écoute (0.0.0.0 = accessible depuis le réseau local)
bind = "0.0.0.0:8080"

# Clé API pour protéger les endpoints d'écriture (MOS, SOC, config, reset)
# Vide ou absent = pas d'authentification (développement uniquement !)
# En production : générez une clé forte (ex: openssl rand -hex 32)
api_key = ""

# Activer CORS (utile si dashboard sur un autre domaine/port en dev)
cors_allow_all = true
# cors_origins = ["http://localhost:3000", "https://dalybms.local"]


[logging]
# Niveau de logs (trace, debug, info, warn, error)
level = "info"

# Format des logs (pretty = coloré et lisible, json = pour parsing)
format = "pretty"


[mqtt]
enabled = true

# Windows avec Docker Desktop local → "localhost"
# Windows avec NanoPi comme broker → "192.168.1.120"
# Raspberry Pi 5 production        → "127.0.0.1" (Mosquitto natif local, bridgé vers NanoPi)
host = "127.0.0.1"
port = 1883

# Préfixe des topics (ex: santuario/bms/1/venus)
topic_prefix = "santuario/bms"

# Intervalle de publication (secondes)
publish_interval_sec = 1

# Authentification MQTT (optionnelle)
# username = ""
# password = ""

# Format de publication
# "json" = un message JSON complet par BMS
# "simple" = un topic par valeur (ex: santuario/bms/1/soc → 75.2)
format = "json"


# =============================================================================
# Venus OS D-Bus bridge (dbus-mqtt-venus)
# =============================================================================
# Ce service publie chaque BMS comme com.victronenergy.battery.{prefix}_{index}
# sur le bus D-Bus de Venus OS, alimenté par les payloads MQTT /venus.
#
# Prérequis :
#   - daly-bms-server actif avec mqtt.enabled = true
#   - Broker Mosquitto accessible (mqtt.host + mqtt.port ci-dessus)
#   - dbus-mqtt-venus déployé sur le NanoPi/GX (voir nanoPi/install-venus.sh)

[venus]
enabled = true

# Bus D-Bus :
#   "system"  → /var/run/dbus/system_bus_socket (Venus OS production)
#   "session" → $DBUS_SESSION_BUS_ADDRESS       (test développement sans sudo)
dbus_bus = "system"

# Préfixe du suffixe de service D-Bus.
# Service résultant : com.victronenergy.battery.{prefix}_{mqtt_index}
# Ex: "mqtt" + mqtt_index=1 → com.victronenergy.battery.mqtt_1
service_prefix = "mqtt"

# Watchdog (secondes) : si aucune donnée MQTT pendant ce délai,
# /Connected passe à 0 → Venus OS marque la batterie comme hors ligne
watchdog_sec = 30

# Intervalle de republication forcée (secondes) — garantit le keepalive Venus OS
# Doit être < watchdog_sec et < 60s (keepalive MQTT bridge Venus)
republish_sec = 25


# =============================================================================
# Capteurs de température extérieure (com.victronenergy.temperature.{n})
# =============================================================================
# Topic MQTT source : santuario/heat/{n}/venus
# Payload attendu (publié par energy-manager depuis Open-Meteo) :
#   { "Temperature": 15.3, "TemperatureType": 4, "Humidity": 65.0, "Pressure": 101.3 }
#
# TemperatureType : 0=battery 1=fridge 2=generic 3=Room 4=Outdoor 5=WaterHeater 6=Freezer
# La valeur config a PRIORITÉ sur celle du payload.

[heat]
# Préfixe des topics température (séparé du BMS prefix)
topic_prefix = "santuario/heat"

[[sensors]]
mqtt_index       = 1       # Topic : santuario/heat/1/venus
name             = "Temperature Exterieure"
temperature_type = 4       # 4 = Outdoor
device_instance  = 20      # DeviceInstance Venus OS / VRM

# =============================================================================
# Pompes à chaleur / chauffe-eau (com.victronenergy.heatpump.{n})
# =============================================================================
# Topic MQTT source : santuario/heatpump/{n}/venus
# Payload attendu (publié par Node-RED) :
#   { "State": 0, "Temperature": 55.0, "TargetTemperature": 60.0,
#     "Ac": { "Power": 1200.0, "Energy": { "Forward": 125.5 } }, "Position": 0 }
#
# /State             — enum état (TBD Victron)
# /Temperature       — température eau courante °C
# /TargetTemperature — température eau cible °C
# /Ac/Power          — puissance consommée W
# /Ac/Energy/Forward — énergie totale kWh
# /Position          — 0=AC Output, 1=AC Input

[heatpump]
# Préfixe des topics heatpump
topic_prefix = "santuario/heatpump"

# Le vrai chauffe-eau (LG ThinQ) est publié par energy-manager sur
# santuario/heatpump/1/venus → com.victronenergy.heatpump.mqtt_1.
# Les ET112 0x08/0x09 ne sont PAS des PAC : ils sont déclarés en acload/grid
# (cf. [[et112.devices]] ci-dessous). Aucun [[heatpumps]] ici —
# daly-bms-server ne lit pas cette section.

# =============================================================================
# Capteur météo / irradiance RS485 (com.victronenergy.meteo)
# =============================================================================
# Topic MQTT source FIXE : santuario/meteo/venus (sans index — un seul capteur)
# Payload attendu (publié par Node-RED depuis capteur RS485 Pi5) :
#   { "Irradiance": 750.0, "TodaysYield": 12.5 }
#
# /Irradiance    — irradiance courante W/m²
# /TodaysYield   — production du jour kWh (depuis le lever du soleil)

[meteo]
topic           = "santuario/meteo/venus"
product_name    = "Capteur Irradiance"
device_instance = 40      # DeviceInstance Venus OS / VRM


# =============================================================================
# Capteur irradiance PRALRAN (RS485 Modbus RTU — bus unifié)
# =============================================================================
# Matériel : Solar Radiation Sensor PRALRAN, adresse Modbus RTU 0x05
# Branché sur le BUS UNIFIÉ /dev/ttyUSB0 (même bus que BMS Daly)
# Registre 0x0000 → irradiance W/m² (FC04, uint16 big-endian)
# Publie sur MQTT : santuario/irradiance/raw (retain=true)
# Même topic que l'ancien irradiance_reader.py → Node-RED inchangé

[irradiance]
address          = "0x05"
name             = "Irradiance PRALRAN"
poll_interval_ms = 5000


# =============================================================================
# Compteur énergie ET112 Carlo Gavazzi (RS485 Modbus RTU — bus unifié)
# =============================================================================
# ARCHITECTURE UNIFIÉE : tous les ET112 partagent le BUS RS485 /dev/ttyUSB0
# (même bus que les BMS Daly 0x01-0x04 et irradiance 0x05)
# Les champs port/baud sont supprimés — bus hérité du SharedBus global.
#
# Adresses RS485 (configurées physiquement sur les compteurs) :
#   0x07 = Micro-onduleurs  → D-Bus pvinverter (mqtt_7, instance 32)
#   0x08 = Maison (conso)    → D-Bus acload     (mqtt_8, instance 30) — charge AC mesurée
#   0x09 = Réseau (EDF)      → D-Bus grid       (mqtt_9, instance 31) — compteur réseau import/export
#
# Sémantique Victron (wiki dbus) :
#   com.victronenergy.grid   = point de connexion réseau (compté import/export, ESS, bilan système)
#   com.victronenergy.acload = consommation AC locale, monitoring indépendant (NON compté dans le grid)

[et112]
# Intervalle de polling en millisecondes (2000 = toutes les 2 secondes)
poll_interval_ms = 2000

# Taille du ring buffer (1800 = 1 heure à 1 mesure/2s)
ring_buffer_size = 1800

[[et112.devices]]               # SN: 119253X — branché ✅
address          = "0x07"
name             = "ET112-Micro-Onduleurs"
mqtt_index       = 7           # → santuario/pvinverter/7/venus
service_type     = "pvinverter"
device_instance  = 32
position         = 1

[[et112.devices]]               # SN: 119215X — branché ✅
address          = "0x08"
name             = "ET112-Maison"
mqtt_index       = 8           # → santuario/grid/8/venus → com.victronenergy.acload.mqtt_8
service_type     = "acload"
device_instance  = 30
position         = 1

[[et112.devices]]               # SN: 061077X — branché ✅
address          = "0x09"
name             = "ET112-Réseau"
mqtt_index       = 9           # → santuario/grid/9/venus → com.victronenergy.grid.mqtt_9
service_type     = "grid"
device_instance  = 31
position         = 1


# =============================================================================
# ATS CHINT NXZB / NXZBN (RS485 Modbus RTU — BUS UNIFIÉ /dev/ttyUSB0)
# =============================================================================
# L'ATS est câblé sur le MÊME bus RS485 que les BMS Daly, ET112 et irradiance.
# Aucun port dédié — il partage le SharedBus ouvert par [serial].
#
# ⚠ PARITÉ : le bus unifié tourne en 9600-8N1 (parité None).
#   L'ATS doit être configuré en parité NONE via son bouton Setup physique
#   ou via le registre Modbus 0x000E = 0x0000 (0=None, 1=Odd, 2=Even).
#
# Adresses RS485 sur le bus unifié /dev/ttyUSB0 :
#   0x01 → BMS-360Ah (Daly)
#   0x02 → BMS-320Ah (Daly)
#   0x05 → Irradiance PRALRAN
#   0x06 → ATS CHINT NXZB  ← ici
#   0x07 → ET112 Micro-Onduleurs
#   0x08 → ET112 PAC Chauffe-eau
#   0x09 → ET112 PAC Climatisation
#
# Registres Modbus ATS (FC=03 lecture) :
#   0x0006–0x000B : tensions phases (V) sources 1 et 2
#   0x000C        : version logicielle (÷100)
#   0x000D        : fréquences (MN uniquement)
#   0x000E        : parité Modbus (0=None, 1=Odd, 2=Even) ← configurer à 0
#   0x0015–0x0017 : compteurs commutations + runtime (h)
#   0x004F        : statut tensions (bitfield phases)
#   0x0050        : statut commutation (SW1/SW2, mode, télécommande, défaut)
#   0x0100–0x0101 : adresse et baud Modbus configurés
#   0x2065–0x206D : seuils UV/OV, délais T1-T4, mode (MN uniquement)
#
# Commandes Modbus (FC=06 écriture) :
#   0x2800 = 0x0004 → activer télécommande
#   0x2800 = 0x0000 → désactiver télécommande
#   0x2700 = 0x0000 → forcer source 1 (Onduleur / AC2)
#   0x2700 = 0x00AA → forcer source 2 (Réseau / AC1)
#   0x2700 = 0x00FF → forcer double déclenché (neutre)
#
# Intégration Venus OS :
#   MQTT topic    : santuario/switch/{mqtt_index}/venus
#   D-Bus service : com.victronenergy.switch.mqtt_1 (instance 60)
#   /Position     : 0 = AC1/Réseau, 1 = AC2/Onduleur
#   /State        : 0 = inactif, 1 = actif, 2 = alerte

[ats]
# Activer le monitoring et les commandes ATS
enabled = true

# Adresse Modbus de l'ATS (défaut usine CHINT = 6)
# Vérifier avec : mbpoll -m rtu -a 1:15 -b 9600 -t 3 -r 1 -c 1 /dev/ttyUSB0
address = 6

# Nom affiché dans le dashboard web et les logs
name = "ATS CHINT NXZB"

# Intervalle de polling en millisecondes (2000 = toutes les 2 secondes)
poll_interval_ms = 2000

# Index MQTT → topic santuario/switch/{mqtt_index}/venus
# Doit correspondre à [[switches]].mqtt_index dans nanoPi/config-nanopi.toml
mqtt_index = 1

# Instance D-Bus Venus OS / VRM portal
# Doit correspondre à [[switches]].device_instance dans config-nanopi.toml
device_instance = 60


# =============================================================================
# Prises connectées Tasmota (MQTT natif Tasmota)
# =============================================================================
# Tasmota publie automatiquement via MQTT :
#   tele/{tasmota_id}/SENSOR  → mesures énergie (puissance, tension, courant, kWh)
#   stat/{tasmota_id}/POWER   → état relais ON/OFF
#
# Prérequis :
#   - Tasmota configuré pour publier sur le broker MQTT (mqtt.host / mqtt.port)
#   - Dans l'interface Tasmota : Configuration → MQTT → Host + User + Password
#   - Option "Full Topic" recommandée : %prefix%/%topic%/ (défaut Tasmota)
#
# service_type = "switch" → forward vers Venus OS com.victronenergy.switch (si mqtt_index défini)
# service_type = "acload" → forward vers Venus OS com.victronenergy.grid (acload)

[tasmota]
# Taille du ring buffer par prise (720 = 1 heure si SENSOR toutes les 5s)
ring_buffer_size = 720

[[tasmota.devices]]
id              = 1                  # Identifiant interne unique (clé du ring buffer)
tasmota_id      = "tongou_3BC764"    # Topics : tele/tongou_3BC764/STATE, stat/tongou_3BC764/POWER
name            = "Tongou Switch1"
mqtt_index      = 2                  # → forward santuario/switch/2/venus → D-Bus switch.mqtt_2
service_type    = "switch"
device_instance = 61                 # Instance D-Bus Venus OS (60=ATS CHINT, 61=Tongou)

[[tasmota.devices]]
id              = 2                  # Identifiant interne unique (clé du ring buffer)
tasmota_id      = "tongou_0A3FA0"    # Topics : tele/tongou_0A3FA0/STATE, stat/tongou_0A3FA0/POWER
name            = "Tongou Switch2"
mqtt_index      = 3                  # → forward santuario/switch/2/venus → D-Bus switch.mqtt_3
service_type    = "switch"
device_instance = 62                 # Instance D-Bus Venus OS (60=ATS CHINT, 61=Tongou)

[[tasmota.devices]]
id              = 3                  # Identifiant interne unique (clé du ring buffer)
tasmota_id      = "tongou_0A3C14"    # Topics : tele/tongou_0A3C14/STATE, stat/tongou_0A3C14/POWER
name            = "Tongou Switch3"
mqtt_index      = 4                  # → forward santuario/switch/2/venus → D-Bus switch.mqtt_4
service_type    = "switch"
device_instance = 63                 # Instance D-Bus Venus OS (60=ATS CHINT, 61=Tongou)

[[tasmota.devices]]
id              = 4                  # Identifiant interne unique (clé du ring buffer)
tasmota_id      = "tongou_0A4040"    # Topics : tele/tongou_0A4040/STATE, stat/tongou_0A4040/POWER
name            = "Tongou Switch4"
mqtt_index      = 5                 # → forward santuario/switch/5/venus → D-Bus switch.mqtt_5
service_type    = "switch"
device_instance = 64                 # Instance D-Bus Venus OS

[[tasmota.devices]]
id              = 5                  # Identifiant interne unique (clé du ring buffer)
tasmota_id      = "tongou_3ACC34"    # 192.168.1.80  tongou-3ACC34
name            = "Tongou Switch5"
mqtt_index      = 6                  # → forward santuario/switch/6/venus → D-Bus switch.mqtt_6
service_type    = "switch"
device_instance = 65                 # Instance D-Bus Venus OS

# Décommenter et adapter pour chaque prise Tasmota supplémentaire :
# [[tasmota.devices]]
# id           = 2           # Identifiant interne unique (clé du ring buffer)
# tasmota_id   = "tasmota_01" # Nom du device Tasmota dans les topics MQTT
# name         = "Prise Salon"
# mqtt_index   = 3            # Optionnel — forward Venus OS switch/3/venus
# service_type = "switch"     # "switch" (défaut) ou "acload"
# device_instance = 500       # Optionnel — instance D-Bus Venus OS

# =============================================================================
# Shelly Pro 2PM — compteurs d'énergie 2 canaux
# =============================================================================
# Topics : {shelly_id}/status/switch:0  et  /status/switch:1
# Commandes : {shelly_id}/rpc  (Switch.Set via MQTT RPC)
[shelly]
ring_buffer_size = 720

[[shelly.devices]]
id        = 1
shelly_id = "shellypro2pm-ec62608840a4"   # IP 192.168.1.136
name      = "DEYE — Shelly Pro 2PM"


# =============================================================================
# metrics-store — backend TSDB embarqué (redb pure-Rust)
# =============================================================================
# Seule TSDB du système (lecture + écriture des séries temporelles).
# Cf. docs/metriques-redb-architecture.md.
#
# IMPORTANT : enabled doit être à `true` en prod, sinon plus aucune lecture/
# écriture de séries temporelles ne fonctionne (le dashboard custom et
# Grafana retournent "no_query_backend").
[metrics_store]
enabled = true
db_path = "/mnt/nvme/daly-bms/metrics.redb"
# Cache pages redb en MiB (jemalloc rend les pages au kernel, donc 16 Mo
# suffit pour notre workload ; baisser encore si RSS sous pression).
cache_mb = 16
# Profondeur de la queue mpsc entre producteurs et writer.
queue_depth = 10000
# Intervalle de la passe de compaction tiered (heures, 0 = désactivé).
maintenance_interval_hours = 6
# Données brutes (pleine résolution). ⚠ Ce paramètre FIXE la taille physique de
# la base (table raw dominante) ET, par voie de conséquence, le PALIER de RSS du
# service : l'état interne de redb (cache de pages + métadonnées d'allocateur/
# régions, gardé vivant par l'Arc<Database>) est proportionnel à la taille du
# fichier. Mesures terrain 2026-06-15 (docs/diagnostic-depannage.md §21) :
#   7 j / 30 j  → RSS 45→~100 Mo en ~5 h puis se STABILISE seul (~100 Mo)
#   60 j        → RSS démarre ~94 Mo et reste ~96 Mo (fichier déjà à son palier)
# Le RSS se stabilise tout seul = ce N'EST PAS une fuite (§21 infirme la
# conclusion « fuite tokio/hyper » de §20). Pour BAISSER le palier RSS : réduire
# cette valeur + compacter (scripts/compact-redb.sh). ⚠ 60 j fait ~3-4 Go →
# démarrages plus lents (tolérés par TimeoutStartSec=300).
raw_retention_days = 60
hourly_retention_days = 365
daily_retention_days = 1825   # 5 ans
# Plancher global d'écriture redb (secondes). 5 = résolution fine RESTAURÉE
# (2026-06-14). NB : passer à 30 divisait le débit de commits redb par 6 mais
# NE corrigeait PAS la fuite RSS (cf. docs/diagnostic-depannage.md §20). 5 s est
# la résolution la plus fine (plancher des tiers internes). Configurable sans
# recompiler.
raw_write_interval_secs = 5


[alerts]
# Chemin de la base SQLite pour journal des alertes.
# Laisser vide pour désactiver complètement les alertes.
db_path = "/var/lib/daly-bms/alerts.db"

# Intervalle d'évaluation des règles (secondes)
check_interval_sec = 1.0

# Telegram (optionnel)
telegram_token = ""
telegram_chat_id = ""

# Email SMTP (optionnel)
smtp_host = ""
smtp_port = 587
smtp_username = ""
smtp_password = ""
smtp_from = "dalybms@santuario.local"
smtp_to = "admin@santuario.local"

# Durées minimales "for:" avant déclenchement (secondes).
# 0 = déclencher immédiatement (comportement legacy).
soc_critical_for_secs = 180   # 3 minutes
soc_low_for_secs      = 300   # 5 minutes
temp_high_for_secs    = 180   # 3 minutes
current_high_for_secs = 120   # 2 minutes
voltage_for_secs      = 60    # 1 minute

# Seuils d'alertes logicielles (indépendants des seuils hardware BMS)
[alerts.thresholds]
cell_ovp_v           = 3.60
cell_uvp_v           = 2.90
cell_delta_mv        = 100
soc_low_percent      = 20.0
soc_critical_percent = 15.0   # SOC critique ESS (était 10, aligné avec vmalert plan)
temp_high_c          = 45.0
current_high_a       = 100.0  # Courant décharge max via SmartShunt (était 80A BMS seul)
pack_ovp_v           = 57.0   # Tension pack trop haute (V)
pack_uvp_v           = 44.0   # Tension pack trop basse (V)


[read_only]
# Mode lecture seule globale (désactive TOUTES les commandes d'écriture)
# Très recommandé en production si pas de besoin de contrôle distant
enabled = false


# =============================================================================
# Configurations individuelles par BMS (optionnel)
# =============================================================================
# Une section [[bms]] par appareil.  Si absente, les valeurs par défaut sont
# utilisées (capacité 100 Ah, pas de nom personnalisé).
# L'adresse est l'adresse RS485 décimale ou hexadécimale.

[[bms]]
address         = "0x01"
name            = "BMS-360Ah"
capacity_ah     = 360.0
max_charge_a    = 180.0
max_discharge_a = 100.0
mqtt_index      = 1
device_instance = 151

[[bms]]
address         = "0x02"
name            = "BMS-320Ah"
capacity_ah     = 320.0
max_charge_a    = 180.0
max_discharge_a = 100.0
mqtt_index      = 2
device_instance = 152

[[bms]]
address         = "0x03"
name            = "BMS-620Ah"
capacity_ah     = 620.0
max_charge_a    = 200.0
max_discharge_a = 120.0
mqtt_index      = 3
device_instance = 153

# [[bms]]                          # ← décommenter quand branché
# address         = "0x04"
# name            = "BMS-4"
# capacity_ah     = 100.0
# max_charge_a    = 200.0
# max_discharge_a = 120.0
# mqtt_index      = 4
# device_instance = 154


# =============================================================================
# Notes supplémentaires
# =============================================================================
# - Les chemins absolus sont fortement recommandés en systemd/Docker
# - Pour la Phase 2 (tout en Docker) : montez /etc/daly-bms/config.toml comme volume
# - Les variables d'environnement ont priorité sur le fichier TOML
#   (ex: DALY_API_KEY=xxx cargo run)
# - Logs : journalctl -u daly-bms -f  ou  RUST_LOG=debug daly-bms-server


# =============================================================================
# energy-manager — Gestionnaire d'énergie (remplace Node-RED)
# =============================================================================
# Binaire séparé : energy-manager
# Port WebSocket live : 8081 (/live)
# Service systemd    : energy-manager
# Secrets dans .env  : LG_DEVICE_ID, LG_BEARER_TOKEN, LG_API_KEY

[energy_manager]

# --- MQTT ---
[energy_manager.mqtt]
host              = "127.0.0.1"       # broker Mosquitto natif Pi5 (loopback)
port              = 1883
keep_alive_secs   = 60
reconnect_delay_secs = 10
# username = ""
# password = ""

# --- WebSocket live ---
[energy_manager.api]
bind = "0.0.0.0:8081"

# --- Victron / Venus OS ---
[energy_manager.victron]
portal_id            = "c0619ab9929a"   # ID portail Victron GX
vebus_instance       = 275              # instance VEBus (Quattro/Multiplus)
mppt1_instance       = 273             # SmartSolar MPPT 1
mppt2_instance       = 289             # SmartSolar MPPT 2
pvinverter_instance  = 32              # ET112 Micro-Onduleurs
shelly_deye_id       = "shellypro2pm-ec62608840a4"
shelly_deye_channel  = 0                # fallback mono-canal (hérité)
shelly_deye_channels = [0, 1]           # un canal par DEYE — coupe/restaure les deux
tasmota_waterheater_id = "tongou_3BC764"
# SmartShunt device instance sur Venus OS — vérifier avec :
#   ssh root@192.168.1.120 "dbus -y | grep battery"
smartshunt_instance  = 274             # VRM ID 274 (Battery Monitor)

# --- Open-Meteo (météo locale) ---
[energy_manager.open_meteo]
enabled            = true
latitude           = 43.9025          # Badalucco (San Bernardo)
longitude          = 7.8364
poll_interval_secs = 300              # 5 minutes

# --- LG ThinQ (chauffe-eau) ---
[energy_manager.lg_thinq]
enabled            = true
base_url           = "https://api-eic.lgthinq.com"
device_id          = "918c240ab4c6e3eee70a4e9ac015c18ddd8b4f933c3d9ff813446d8f8dddf720"
bearer_token       = "thinqpat_975d93159fdcf31033e33a3b9c49009ae1ffbf345dfa6dcb4e2f"
api_key            = "v6GFvkweNo7DK7yD3ylIZ9w52aKBU0eJ7wLXkSR3"
country            = "FR"
client_id          = "Santuario-123456"
poll_interval_secs = 600              # 10 minutes
vm_url             = "http://127.0.0.1:8080"  # daly-bms-server → metrics-store redb (POST /api/v1/import/prometheus)

# --- Gestion courant de charge ---
[energy_manager.charge_current]
offgrid_max_a         = 70.0          # A max hors réseau
grid_pv_excess_a      = 4.0           # A si surplus PV + réseau
grid_no_excess_a      = 0.0           # A si pas de surplus + réseau
pv_excess_threshold_w = 50.0          # W minimum pour déclencher l'excédent

# --- Commande relais DEYE (via Shelly) ---
[energy_manager.deye]
freq_high_hz               = 51.0     # Hz — coupure débouncée (sous l'auto-trip DEYE 51.5)
freq_hard_hz               = 51.3     # Hz — coupure immédiate (filet pré-trip)
freq_low_hz                = 50.3     # Hz — seuil de réactivation
cut_delay_secs             = 3        # s — débounce coupure (bat la rampe vers 51.5)
reenable_delay_secs        = 45       # s — bas-soutenu avant réactivation
lockout_secs               = 120      # s — anti-oscillation après coupure
restore_soc_pct            = 95.0     # % — SOC ≥ → excédent structurel présumé → maintien coupé
restore_irradiance_wm2     = 250.0    # W/m² — irradiance ≥ → soleil fort → maintien coupé
corroboration_max_age_secs = 60       # s — fraîcheur SmartShunt (au-delà : fréquence seule, fail-open)
relay_resync_secs          = 60       # s — ré-affirmation périodique de l'état des 2 canaux
# Coupure anticipée sur l'état de charge des MPPT (DC-couplé) — termine la charge sur le
# seul MPPT, sans atteindre la fréquence haute. Bascule : mettre false pour fréquence seule.
mppt_cut_enabled           = true     # active la coupure DEYE pilotée par l'état MPPT
mppt_full_states           = [4, 5, 6] # codes State « batterie pleine » : 4=Absorption,5=Float,6=Storage
mppt_cut_delay_secs        = 10       # s — débounce : MPPT « plein » maintenu avant coupure

# --- Chauffe-eau LG ThinQ ---
[energy_manager.water_heater]
solar_min_w           = 1000        # W — production min pour HEAT_PUMP
debounce_secs         = 300           # s — 5 min avant changement de mode
mode_change_min_secs  = 900           # s — 15 min entre deux changements
heat_pump_target_c    = 60.0          # °C cible en HEAT_PUMP
vacation_target_c     = 45.0          # °C cible en VACATION
temp_set_delay_secs   = 15            # s — délai avant réglage temp
keepalive_secs        = 25            # s — keepalive Venus OS watchdog
irradiance_min_wm2    = 300         # W/m² — irradiance min pour activer HEAT_PUMP
vm_url                = "http://127.0.0.1:8080"  # daly-bms-server → metrics-store redb (POST /api/v1/import/prometheus)

# --- Production solaire ---
[energy_manager.solar]
bms_server_url       = "http://192.168.1.141:8080"
persist_measurement  = "solar_persist"
power_measurement    = "solar_power"
host_tag             = "pi5"

# --- Statut plateforme ---
[energy_manager.platform]
publish_interval_secs = 60
