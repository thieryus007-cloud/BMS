# Dependabot (audit 2026-06 §16) — cadence mensuelle, volume limité :
# les PRs se mergent manuellement, la CI (tests + clippy + cross-builds
# aarch64/armv7 + cargo-deny) sert de filet. Cargo.lock committé = les
# montées de versions sont explicites, jamais subies.
version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      # Grouper les patchs mineurs pour limiter le bruit de PRs.
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
