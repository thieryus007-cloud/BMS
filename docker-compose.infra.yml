# docker-compose.infra.yml
# Infrastructure de base pour DalyBMS — Mosquitto uniquement
# Tsink est le stockage time-series embarqué dans daly-bms-server (pas de Docker nécessaire).

services:

  mosquitto:
    image: eclipse-mosquitto:2.0.18
    container_name: dalybms-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./docker/mosquitto/config:/mosquitto/config
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h localhost -t '$$health' -m ok -q 0 && echo ok"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mosquitto-data:
  mosquitto-log:
