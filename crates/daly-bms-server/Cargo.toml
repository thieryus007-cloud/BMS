[package]
name        = "daly-bms-server"
description = "Serveur Axum (API REST + WebSocket) + bridges (MQTT, metrics-store redb, Alertes)"
version.workspace   = true
edition.workspace   = true
authors.workspace   = true
license.workspace   = true
rust-version.workspace = true

[[bin]]
name = "daly-bms-server"
path = "src/main.rs"

[dependencies]
rs485-bus     = { workspace = true }
daly-bms-core = { path = "../daly-bms-core" }
metrics-store = { workspace = true }

tokio          = { workspace = true }
tokio-serial   = { workspace = true }
serde          = { workspace = true }
serde_json     = { workspace = true }
toml           = { workspace = true }
serde_ignored  = { workspace = true }
anyhow         = { workspace = true }
thiserror      = { workspace = true }
tracing        = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender   = { workspace = true }
axum           = { workspace = true }
tower          = { workspace = true }
tower-http     = { workspace = true }
rumqttc        = { workspace = true }
rusqlite       = { workspace = true }
reqwest        = { workspace = true }
lettre         = { workspace = true }
chrono         = { workspace = true }
uuid           = { workspace = true }
futures        = { workspace = true }
bytes          = { workspace = true }
askama         = "0.12"
# tokio-modbus supprimé — remplacé par rs485_bus::modbus_rtu (pur Rust)

# ── Monitoring ────────────────────────────────────────────────────────────────
sd-notify     = { workspace = true }
tokio-metrics = { workspace = true }

# Allocator jemalloc — remplace glibc malloc pour éliminer la fragmentation
# heap observée en prod (RSS qui croît à chaque burst dashboard sans
# redescendre). jemalloc rend agressivement les pages au kernel.
# Cf. observation 18 mai : malloc_trim libère 18 Mo après une request →
# fragmentation glibc confirmée. Switch jemalloc résoud le problème
# sans appel manuel à trim.
[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = "0.6"
