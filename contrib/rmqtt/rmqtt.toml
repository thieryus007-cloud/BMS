# =============================================================================
# rmqtt.toml — Configuration broker RMQTT pour DalyBMS / Pi5
# Version cible : rmqtt 0.20.0
# Voir docs/rmqtt-migration-guide.md §7
# =============================================================================

[node]
id = 1
plugins_dir = "/etc/rmqtt/plugins"
plugins_default_startups = [
    "rmqtt-retainer",
    "rmqtt-http-api",
    "rmqtt-bridge-ingress-mqtt",
    "rmqtt-bridge-egress-mqtt",
]

[log]
level = "info"
to = "file"
dir = "/var/log/rmqtt"

# ── Listener MQTT TCP :1883 ───────────────────────────────────────────────────
[[listeners.tcp]]
name = "external"
addr = "0.0.0.0:1883"
max_connections = 500

  [listeners.tcp.options]
  connect_timeout = "15s"
  max_packet_size = "1mb"
  allow_anonymous = true

# ── Listener WebSocket MQTT :9001 ─────────────────────────────────────────────
[[listeners.ws]]
name = "websocket"
addr = "0.0.0.0:9001"

  [listeners.ws.options]
  connect_timeout = "15s"
  max_packet_size = "1mb"
  allow_anonymous = true
