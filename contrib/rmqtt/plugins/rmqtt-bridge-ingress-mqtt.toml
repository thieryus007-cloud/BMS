# =============================================================================
# Bridge INGRESS : NanoPi (192.168.1.120) → Pi5 local
# Voir docs/rmqtt-migration-guide.md §8 — RÈGLE ANTI-BOUCLE
#
# Topics autorisés ICI : N/{portal}/#, tele/#, stat/#, shellypro2pm/#,
#                        daly-bms-shelly/rpc
# Tout autre topic doit être dans le bridge EGRESS (santuario/*, cmnd/*, W/*, R/*)
# =============================================================================

[[bridges]]
enable = true
name = "nanopi-to-pi5"
client_id_prefix = "dalybms-bridge-in"
server = "192.168.1.120:1883"

connect_timeout = "20s"
keepalive = "60s"
reconnect_interval = "5s"
expiry_interval = "5m"
mqtt_ver = "v4"

  [bridges.options]
  clean_session = true
  concurrent_client_limit = 1

  # Venus OS télémétriques (Cerbo GX) — portal_id à synchroniser avec Config.toml
  [[bridges.entries]]
  [bridges.entries.remote]
  topic = "N/c0619ab9929a/#"
  qos = 0
  [bridges.entries.local]
  topic = "${remote.topic}"
  qos = 0
  retain = false

  # Tasmota / Tongou — mesures énergie
  [[bridges.entries]]
  [bridges.entries.remote]
  topic = "tele/#"
  qos = 0
  [bridges.entries.local]
  topic = "${remote.topic}"
  qos = 0
  retain = false

  # Tasmota / Tongou — état relais
  [[bridges.entries]]
  [bridges.entries.remote]
  topic = "stat/#"
  qos = 0
  [bridges.entries.local]
  topic = "${remote.topic}"
  qos = 0
  retain = false

  # Shelly Pro 2PM — status + events
  [[bridges.entries]]
  [bridges.entries.remote]
  topic = "shellypro2pm-ec62608840a4/#"
  qos = 0
  [bridges.entries.local]
  topic = "${remote.topic}"
  qos = 0
  retain = false

  # Réponses RPC Shelly
  [[bridges.entries]]
  [bridges.entries.remote]
  topic = "daly-bms-shelly/rpc"
  qos = 0
  [bridges.entries.local]
  topic = "${remote.topic}"
  qos = 0
  retain = false
