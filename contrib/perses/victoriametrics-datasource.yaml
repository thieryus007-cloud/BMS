kind: GlobalDatasource
metadata:
  name: victoriametrics
spec:
  default: true
  plugin:
    kind: Prometheus
    spec:
      proxy:
        kind: HTTPProxy
        spec:
          url: "http://127.0.0.1:8428"
          allowedEndpoints:
            - endpointPattern: "/api/v1/.*"
              method: GET
            - endpointPattern: "/api/v1/.*"
              method: POST
