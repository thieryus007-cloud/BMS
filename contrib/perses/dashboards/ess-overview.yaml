kind: Dashboard
metadata:
  name: ess-overview
  project: default
spec:
  display:
    name: "ESS — Tableau de bord Énergie"
    description: "Vue d'ensemble système ESS : solaire, batteries Daly, réseau, consommation — VictoriaMetrics"
  duration: 3h
  refreshInterval: "15s"

  panels:

    # ════════════════════════════════════════════════════════════════════
    # BILAN INSTANTANÉ
    # ════════════════════════════════════════════════════════════════════

    stat_solar_w:
      kind: Panel
      spec:
        display:
          name: "Solaire"
          description: "MPPT + Micro-onduleurs"
        plugin:
          kind: StatChart
          spec:
            calculation: last-number
            format:
              unit: watts
            thresholds:
              steps:
                - color: "#6e6e6e"
                  value: 0
                - color: "#73BF69"
                  value: 200
                - color: "#3dcc3d"
                  value: 2000
                - color: "#2eb82e"
                  value: 4000
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: victoriametrics
                  query: "solar_total_w"

    stat_battery_w:
      kind: Panel
      spec:
        display:
          name: "Batterie"
          description: "SmartShunt — positif=charge, négatif=décharge"
        plugin:
          kind: StatChart
          spec:
            calculation: last-number
            format:
              unit: watts
            thresholds:
              steps:
                - color: "#F2495C"
                  value: -9999
                - color: "#FADE2A"
                  value: -200
                - color: "#6e6e6e"
                  value: -50
                - color: "#5794F2"
                  value: 50
                - color: "#73BF69"
                  value: 500
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: victoriametrics
                  query: "venus_shunt_power_w"

    stat_house_w:
      kind: Panel
      spec:
        display:
          name: "Consommation Maison"
          description: "ET112-Maison (0x08)"
        plugin:
          kind: StatChart
          spec:
            calculation: last-number
            format:
              unit: watts
            thresholds:
              steps:
                - color: "#73BF69"
                  value: 0
                - color: "#FADE2A"
                  value: 1500
                - color: "#F2495C"
                  value: 3000
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: victoriametrics
                  query: "et112_power_w{address=\"0x08\"}"

    stat_grid_w:
      kind: Panel
      spec:
        display:
          name: "Réseau"
          description: "ET112-Réseau (0x09) — positif=import, négatif=export"
        plugin:
          kind: StatChart
          spec:
            calculation: last-number
            format:
              unit: watts
            thresholds:
              steps:
                - color: "#73BF69"
                  value: -9999
                - color: "#6e6e6e"
                  value: -100
                - color: "#FADE2A"
                  value: 100
                - color: "#F2495C"
                  value: 1000
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: victoriametrics
                  query: "et112_power_w{address=\"0x09\"}"

    stat_soc:
      kind: Panel
      spec:
        display:
          name: "SOC Batterie"
          description: "SmartShunt Victron"
        plugin:
          kind: StatChart
          spec:
            calculation: last-number
            format:
              unit: percent
            thresholds:
              steps:
                - color: "#F2495C"
                  value: 0
                - color: "#FADE2A"
                  value: 20
                - color: "#73BF69"
                  value: 50
                - color: "#2eb82e"
                  value: 80
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: victoriametrics
                  query: "venus_shunt_soc_percent"

    stat_temp_ext:
      kind: Panel
      spec:
        display:
          name: "Température Ext."
          description: "Capteur Victron (instance 20)"
        plugin:
          kind: StatChart
          spec:
            calculation: last-number
            format:
              unit: celsius
            thresholds:
              steps:
                - color: "#5794F2"
                  value: -10
                - color: "#73BF69"
                  value: 15
                - color: "#FADE2A"
                  value: 30
                - color: "#F2495C"
                  value: 38
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: victoriametrics
                  query: "venus_temp_c{instance=\"20\"}"

    # ════════════════════════════════════════════════════════════════════
    # FLUX DE PUISSANCE
    # ════════════════════════════════════════════════════════════════════

    ts_power_flow:
      kind: Panel
      spec:
        display:
          name: "Flux de Puissance"
          description: "Solaire, Batterie, Maison, Réseau"
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
              mode: table
            visual:
              lineWidth: 2
              areaOpacity: 0.08
            yAxis:
              format:
                unit: watts
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: victoriametrics
                  query: "solar_total_w"
                  seriesNameFormat: "Solaire"
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: victoriametrics
                  query: "venus_shunt_power_w"
                  seriesNameFormat: "Batterie (±)"
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: victoriametrics
                  query: "et112_power_w{address=\"0x08\"}"
                  seriesNameFormat: "Consommation Maison"
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: victoriametrics
                  query: "et112_power_w{address=\"0x09\"}"
                  seriesNameFormat: "Réseau (±)"

    # ════════════════════════════════════════════════════════════════════
    # BATTERIES
    # ════════════════════════════════════════════════════════════════════

    stat_soc_bms1:
      kind: Panel
      spec:
        display:
          name: "SOC BMS-1 (360Ah)"
          description: "Daly BMS addr 0x01"
        plugin:
          kind: StatChart
          spec:
            calculation: last-number
            format:
              unit: percent
            thresholds:
              steps:
                - color: "#F2495C"
                  value: 0
                - color: "#FADE2A"
                  value: 20
                - color: "#73BF69"
                  value: 50
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: victoriametrics
                  query: "bms_soc{bms_id=\"0x01\"}"

    stat_soc_bms2:
      kind: Panel
      spec:
        display:
          name: "SOC BMS-2 (320Ah)"
          description: "Daly BMS addr 0x02"
        plugin:
          kind: StatChart
          spec:
            calculation: last-number
            format:
              unit: percent
            thresholds:
              steps:
                - color: "#F2495C"
                  value: 0
                - color: "#FADE2A"
                  value: 20
                - color: "#73BF69"
                  value: 50
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: victoriametrics
                  query: "bms_soc{bms_id=\"0x02\"}"

    stat_battery_v:
      kind: Panel
      spec:
        display:
          name: "Tension Batterie"
          description: "SmartShunt"
        plugin:
          kind: StatChart
          spec:
            calculation: last-number
            format:
              unit: volts
            thresholds:
              steps:
                - color: "#F2495C"
                  value: 0
                - color: "#FADE2A"
                  value: 46
                - color: "#73BF69"
                  value: 51
                - color: "#2eb82e"
                  value: 54
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: victoriametrics
                  query: "venus_shunt_voltage_v"

    stat_cell_delta:
      kind: Panel
      spec:
        display:
          name: "Delta Cellules Max"
          description: "Déséquilibre cellulaire (deux BMS)"
        plugin:
          kind: StatChart
          spec:
            calculation: last-number
            format:
              unit: milliseconds
            thresholds:
              steps:
                - color: "#73BF69"
                  value: 0
                - color: "#FADE2A"
                  value: 50
                - color: "#F2495C"
                  value: 150
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: victoriametrics
                  query: "max(bms_cell_delta_mv)"
                  seriesNameFormat: "Delta (mV)"

    ts_soc_history:
      kind: Panel
      spec:
        display:
          name: "SOC Historique"
          description: "SmartShunt + BMS1 + BMS2"
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
              mode: table
            visual:
              lineWidth: 2
              areaOpacity: 0.05
            yAxis:
              format:
                unit: percent
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: victoriametrics
                  query: "venus_shunt_soc_percent"
                  seriesNameFormat: "SOC SmartShunt"
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: victoriametrics
                  query: "bms_soc{bms_id=\"0x01\"}"
                  seriesNameFormat: "SOC BMS-1 360Ah"
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: victoriametrics
                  query: "bms_soc{bms_id=\"0x02\"}"
                  seriesNameFormat: "SOC BMS-2 320Ah"

    ts_battery_current:
      kind: Panel
      spec:
        display:
          name: "Courant Batterie"
          description: "SmartShunt — positif=charge, négatif=décharge"
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
              mode: table
            visual:
              lineWidth: 2
              areaOpacity: 0.08
            yAxis:
              format:
                unit: amperes
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: victoriametrics
                  query: "venus_shunt_current_a"
                  seriesNameFormat: "Courant SmartShunt"
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: victoriametrics
                  query: "bms_current{bms_id=\"0x01\"}"
                  seriesNameFormat: "Courant BMS-1"
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: victoriametrics
                  query: "bms_current{bms_id=\"0x02\"}"
                  seriesNameFormat: "Courant BMS-2"

    ts_battery_voltage:
      kind: Panel
      spec:
        display:
          name: "Tension Batteries"
          description: "SmartShunt + BMS1 + BMS2"
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
              mode: table
            visual:
              lineWidth: 2
            yAxis:
              format:
                unit: volts
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: victoriametrics
                  query: "venus_shunt_voltage_v"
                  seriesNameFormat: "Tension SmartShunt"
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: victoriametrics
                  query: "bms_voltage{bms_id=\"0x01\"}"
                  seriesNameFormat: "Tension BMS-1"
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: victoriametrics
                  query: "bms_voltage{bms_id=\"0x02\"}"
                  seriesNameFormat: "Tension BMS-2"

    stat_bms_temp:
      kind: Panel
      spec:
        display:
          name: "Température BMS Max"
          description: "Max des deux BMS"
        plugin:
          kind: StatChart
          spec:
            calculation: last-number
            format:
              unit: celsius
            thresholds:
              steps:
                - color: "#5794F2"
                  value: 0
                - color: "#73BF69"
                  value: 10
                - color: "#FADE2A"
                  value: 35
                - color: "#F2495C"
                  value: 45
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: victoriametrics
                  query: "max(bms_temp_max)"

    stat_mos_status:
      kind: Panel
      spec:
        display:
          name: "MOS Charge (BMS-1)"
          description: "1=autorisé, 0=bloqué"
        plugin:
          kind: StatChart
          spec:
            calculation: last-number
            format:
              unit: short
            thresholds:
              steps:
                - color: "#F2495C"
                  value: 0
                - color: "#73BF69"
                  value: 1
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: victoriametrics
                  query: "bms_charge_mos{bms_id=\"0x01\"}"

    stat_mos_discharge:
      kind: Panel
      spec:
        display:
          name: "MOS Décharge (BMS-1)"
          description: "1=autorisé, 0=bloqué"
        plugin:
          kind: StatChart
          spec:
            calculation: last-number
            format:
              unit: short
            thresholds:
              steps:
                - color: "#F2495C"
                  value: 0
                - color: "#73BF69"
                  value: 1
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: victoriametrics
                  query: "bms_discharge_mos{bms_id=\"0x01\"}"

    # ════════════════════════════════════════════════════════════════════
    # SOLAIRE
    # ════════════════════════════════════════════════════════════════════

    stat_mppt1:
      kind: Panel
      spec:
        display:
          name: "MPPT 1 (inst.273)"
          description: "SmartSolar Victron"
        plugin:
          kind: StatChart
          spec:
            calculation: last-number
            format:
              unit: watts
            thresholds:
              steps:
                - color: "#6e6e6e"
                  value: 0
                - color: "#73BF69"
                  value: 100
                - color: "#2eb82e"
                  value: 1000
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: victoriametrics
                  query: "venus_mppt_power_w{instance=\"273\"}"

    stat_mppt2:
      kind: Panel
      spec:
        display:
          name: "MPPT 2 (inst.289)"
          description: "SmartSolar Victron"
        plugin:
          kind: StatChart
          spec:
            calculation: last-number
            format:
              unit: watts
            thresholds:
              steps:
                - color: "#6e6e6e"
                  value: 0
                - color: "#73BF69"
                  value: 100
                - color: "#2eb82e"
                  value: 1000
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: victoriametrics
                  query: "venus_mppt_power_w{instance=\"289\"}"

    stat_micro_onduleurs:
      kind: Panel
      spec:
        display:
          name: "Micro-Onduleurs"
          description: "ET112-Micro-Onduleurs (0x07)"
        plugin:
          kind: StatChart
          spec:
            calculation: last-number
            format:
              unit: watts
            thresholds:
              steps:
                - color: "#6e6e6e"
                  value: 0
                - color: "#73BF69"
                  value: 100
                - color: "#2eb82e"
                  value: 1000
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: victoriametrics
                  query: "et112_power_w{address=\"0x07\"}"

    stat_irradiance:
      kind: Panel
      spec:
        display:
          name: "Irradiance"
          description: "Capteur PRALRAN (W/m²)"
        plugin:
          kind: StatChart
          spec:
            calculation: last-number
            format:
              unit: "W/m²"
            thresholds:
              steps:
                - color: "#6e6e6e"
                  value: 0
                - color: "#FADE2A"
                  value: 100
                - color: "#FF9830"
                  value: 600
                - color: "#F2495C"
                  value: 900
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: victoriametrics
                  query: "irradiance_wm2"

    ts_solar_detail:
      kind: Panel
      spec:
        display:
          name: "Solaire Détail"
          description: "MPPT1, MPPT2, Micro-onduleurs, Total"
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
              mode: table
            visual:
              lineWidth: 2
              areaOpacity: 0.1
            yAxis:
              format:
                unit: watts
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: victoriametrics
                  query: "solar_total_w"
                  seriesNameFormat: "Total"
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: victoriametrics
                  query: "venus_mppt_power_w{instance=\"273\"}"
                  seriesNameFormat: "MPPT 1"
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: victoriametrics
                  query: "venus_mppt_power_w{instance=\"289\"}"
                  seriesNameFormat: "MPPT 2"
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: victoriametrics
                  query: "et112_power_w{address=\"0x07\"}"
                  seriesNameFormat: "Micro-onduleurs"
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: victoriametrics
                  query: "mppt_power_w"
                  seriesNameFormat: "MPPT total agrégé"

    ts_irradiance_hist:
      kind: Panel
      spec:
        display:
          name: "Irradiance"
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
            visual:
              lineWidth: 2
              areaOpacity: 0.15
            yAxis:
              format:
                unit: "W/m²"
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: victoriametrics
                  query: "irradiance_wm2"
                  seriesNameFormat: "Irradiance"

    stat_mppt1_yield:
      kind: Panel
      spec:
        display:
          name: "MPPT 1 — Production Jour"
        plugin:
          kind: StatChart
          spec:
            calculation: last-number
            format:
              unit: watt-hours
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: victoriametrics
                  query: "venus_mppt_yield_today_kwh{instance=\"273\"} * 1000"

    stat_mppt2_yield:
      kind: Panel
      spec:
        display:
          name: "MPPT 2 — Production Jour"
        plugin:
          kind: StatChart
          spec:
            calculation: last-number
            format:
              unit: watt-hours
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: victoriametrics
                  query: "venus_mppt_yield_today_kwh{instance=\"289\"} * 1000"

    stat_mppt1_max:
      kind: Panel
      spec:
        display:
          name: "MPPT 1 — Pic Jour"
        plugin:
          kind: StatChart
          spec:
            calculation: last-number
            format:
              unit: watts
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: victoriametrics
                  query: "venus_mppt_max_power_today_w{instance=\"273\"}"

    stat_mppt2_max:
      kind: Panel
      spec:
        display:
          name: "MPPT 2 — Pic Jour"
        plugin:
          kind: StatChart
          spec:
            calculation: last-number
            format:
              unit: watts
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: victoriametrics
                  query: "venus_mppt_max_power_today_w{instance=\"289\"}"

    # ════════════════════════════════════════════════════════════════════
    # BILAN JOURNALIER
    # ════════════════════════════════════════════════════════════════════

    stat_solar_today:
      kind: Panel
      spec:
        display:
          name: "Production Solaire Aujourd'hui"
        plugin:
          kind: StatChart
          spec:
            calculation: last-number
            format:
              unit: watt-hours
            thresholds:
              steps:
                - color: "#6e6e6e"
                  value: 0
                - color: "#73BF69"
                  value: 5000
                - color: "#2eb82e"
                  value: 15000
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: victoriametrics
                  query: "solar_yield_kwh * 1000"

    stat_battery_in_today:
      kind: Panel
      spec:
        display:
          name: "Énergie Chargée Batterie"
          description: "SmartShunt — aujourd'hui"
        plugin:
          kind: StatChart
          spec:
            calculation: last-number
            format:
              unit: watt-hours
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: victoriametrics
                  query: "venus_shunt_energy_in_kwh * 1000"

    stat_battery_out_today:
      kind: Panel
      spec:
        display:
          name: "Énergie Déchargée Batterie"
          description: "SmartShunt — aujourd'hui"
        plugin:
          kind: StatChart
          spec:
            calculation: last-number
            format:
              unit: watt-hours
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: victoriametrics
                  query: "venus_shunt_energy_out_kwh * 1000"

    stat_grid_import_today:
      kind: Panel
      spec:
        display:
          name: "Import Réseau Aujourd'hui"
        plugin:
          kind: StatChart
          spec:
            calculation: last-number
            format:
              unit: watt-hours
            thresholds:
              steps:
                - color: "#73BF69"
                  value: 0
                - color: "#FADE2A"
                  value: 5000
                - color: "#F2495C"
                  value: 10000
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: victoriametrics
                  query: "increase(et112_energy_import_wh{address=\"0x09\"}[24h])"

    stat_grid_export_today:
      kind: Panel
      spec:
        display:
          name: "Export Réseau Aujourd'hui"
        plugin:
          kind: StatChart
          spec:
            calculation: last-number
            format:
              unit: watt-hours
            thresholds:
              steps:
                - color: "#6e6e6e"
                  value: 0
                - color: "#73BF69"
                  value: 1000
                - color: "#2eb82e"
                  value: 5000
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: victoriametrics
                  query: "increase(et112_energy_export_wh{address=\"0x09\"}[24h])"

    stat_taux_cyclage:
      kind: Panel
      spec:
        display:
          name: "Taux de Cyclage (24h)"
          description: "Ah échangés / 680Ah total × 100"
        plugin:
          kind: StatChart
          spec:
            calculation: last-number
            format:
              unit: percent
            thresholds:
              steps:
                - color: "#73BF69"
                  value: 0
                - color: "#FADE2A"
                  value: 30
                - color: "#F2495C"
                  value: 60
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: victoriametrics
                  query: >-
                    (
                      abs(avg_over_time(clamp_min(venus_shunt_current_a, 0)[24h]))
                      + abs(avg_over_time(clamp_max(venus_shunt_current_a, 0)[24h]))
                    ) * 24 / 680 * 100

    ts_daily_bars:
      kind: Panel
      spec:
        display:
          name: "Production Journalière (30 jours)"
        plugin:
          kind: TimeSeriesChart
          spec:
            visual:
              display: bar
            yAxis:
              format:
                unit: watt-hours
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: victoriametrics
                  query: "max_over_time(solar_yield_kwh[1d]) * 1000"
                  seriesNameFormat: "Production journalière"

    # ════════════════════════════════════════════════════════════════════
    # RÉSEAU & CONSOMMATION
    # ════════════════════════════════════════════════════════════════════

    ts_grid_consumption:
      kind: Panel
      spec:
        display:
          name: "Réseau & Consommation"
          description: "Grid (±), Maison, Chauffe-eau"
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
              mode: table
            visual:
              lineWidth: 2
              areaOpacity: 0.08
            yAxis:
              format:
                unit: watts
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: victoriametrics
                  query: "et112_power_w{address=\"0x09\"}"
                  seriesNameFormat: "Réseau (±)"
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: victoriametrics
                  query: "et112_power_w{address=\"0x08\"}"
                  seriesNameFormat: "Consommation Maison"
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: victoriametrics
                  query: "venus_heatpump_power_w{idx=\"8\"}"
                  seriesNameFormat: "Chauffe-eau"

    # ════════════════════════════════════════════════════════════════════
    # QUALITÉ RÉSEAU & ÉQUIPEMENTS
    # ════════════════════════════════════════════════════════════════════

    stat_grid_voltage:
      kind: Panel
      spec:
        display:
          name: "Tension Réseau"
          description: "ET112-Réseau (0x09)"
        plugin:
          kind: StatChart
          spec:
            calculation: last-number
            format:
              unit: volts
            thresholds:
              steps:
                - color: "#F2495C"
                  value: 0
                - color: "#FADE2A"
                  value: 210
                - color: "#73BF69"
                  value: 220
                - color: "#FADE2A"
                  value: 235
                - color: "#F2495C"
                  value: 245
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: victoriametrics
                  query: "et112_voltage_v{address=\"0x09\"}"

    stat_grid_freq:
      kind: Panel
      spec:
        display:
          name: "Fréquence Réseau"
          description: "ET112-Réseau (0x09)"
        plugin:
          kind: StatChart
          spec:
            calculation: last-number
            format:
              unit: hertz
            thresholds:
              steps:
                - color: "#F2495C"
                  value: 0
                - color: "#FADE2A"
                  value: 49.5
                - color: "#73BF69"
                  value: 50
                - color: "#FADE2A"
                  value: 50.5
                - color: "#F2495C"
                  value: 51
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: victoriametrics
                  query: "et112_frequency_hz{address=\"0x09\"}"

    stat_ats_source:
      kind: Panel
      spec:
        display:
          name: "Source Active ATS"
          description: "0=Onduleur (AC2), 1=Réseau (AC1), 2=Neutre"
        plugin:
          kind: StatChart
          spec:
            calculation: last-number
            format:
              unit: short
            thresholds:
              steps:
                - color: "#73BF69"
                  value: 0
                - color: "#5794F2"
                  value: 1
                - color: "#F2495C"
                  value: 2
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: victoriametrics
                  query: "ats_active_source"

    stat_water_heater_temp:
      kind: Panel
      spec:
        display:
          name: "Chauffe-eau"
          description: "Température eau (°C)"
        plugin:
          kind: StatChart
          spec:
            calculation: last-number
            format:
              unit: celsius
            thresholds:
              steps:
                - color: "#5794F2"
                  value: 0
                - color: "#73BF69"
                  value: 45
                - color: "#FADE2A"
                  value: 60
                - color: "#F2495C"
                  value: 70
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: victoriametrics
                  query: "venus_heatpump_temp_c{idx=\"8\"}"

    stat_water_heater_power:
      kind: Panel
      spec:
        display:
          name: "Puissance Chauffe-eau"
        plugin:
          kind: StatChart
          spec:
            calculation: last-number
            format:
              unit: watts
            thresholds:
              steps:
                - color: "#6e6e6e"
                  value: 0
                - color: "#5794F2"
                  value: 100
                - color: "#FADE2A"
                  value: 1500
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: victoriametrics
                  query: "venus_heatpump_power_w{idx=\"8\"}"

    stat_inverter_out:
      kind: Panel
      spec:
        display:
          name: "Onduleur AC Sortie"
          description: "EasySolar II GX"
        plugin:
          kind: StatChart
          spec:
            calculation: last-number
            format:
              unit: watts
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: victoriametrics
                  query: "venus_inverter_ac_output_power_w"

    stat_inverter_v_dc:
      kind: Panel
      spec:
        display:
          name: "Onduleur Tension DC"
          description: "EasySolar II GX — côté batterie"
        plugin:
          kind: StatChart
          spec:
            calculation: last-number
            format:
              unit: volts
            thresholds:
              steps:
                - color: "#F2495C"
                  value: 0
                - color: "#FADE2A"
                  value: 46
                - color: "#73BF69"
                  value: 51
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: victoriametrics
                  query: "venus_inverter_voltage_v"

