kind: Dashboard
metadata:
  name: pv-solar-5y
  project: perses
  labels:
    category: pv
    source: victron
spec:
  display:
    name: "☀️ PV Solaire - Monitoring & Comparaison 5 Ans"
    description: "Monitoring PV Victron + Daly-BMS avec comparaison multi-années — VictoriaMetrics"

  duration: 7d
  refreshInterval: "30s"

  datasources:
    victoriametrics:
      default: true
      plugin:
        kind: PrometheusDatasource
        spec:
          url: "http://127.0.0.1:8428"
          proxy: true
          timeInterval: "10s"

  panels:
    # === Puissance Instantanée ===
    total_power_stat:
      kind: Panel
      spec:
        display:
          name: "Puissance PV Totale"
        plugin:
          kind: StatChart
          spec:
            value:
              calc: "lastNotNull"
            unit: "watt"
            colorMode: "threshold"
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: "solar_total_w"

    mppt_power_stat:
      kind: Panel
      spec:
        display:
          name: "MPPT (DC)"
        plugin:
          kind: StatChart
          spec:
            value:
              calc: "lastNotNull"
            unit: "watt"
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: "dc_pv_power_w"

    ac_power_stat:
      kind: Panel
      spec:
        display:
          name: "Micro-Onduleurs (AC)"
        plugin:
          kind: StatChart
          spec:
            value:
              calc: "lastNotNull"
            unit: "watt"
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: "pvinv_power_w"

    daily_yield_stat:
      kind: Panel
      spec:
        display:
          name: "Production du Jour"
        plugin:
          kind: StatChart
          spec:
            value:
              calc: "lastNotNull"
            unit: "kwatth"
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: "max_over_time(solar_yield_kwh[24h])"

    power_timeseries:
      kind: Panel
      spec:
        display:
          name: "Courbe Puissance (Temps Réel)"
        plugin:
          kind: TimeSeriesChart
          spec:
            visual:
              display: "line"
              lineWidth: 2
              areaOpacity: 0.15
            yAxis:
              format:
                unit: "watt"
            legend:
              displayMode: "table"
              placement: "right"
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: "solar_total_w"
                  seriesNameFormat: "Total"
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: "dc_pv_power_w"
                  seriesNameFormat: "MPPT (DC)"
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: "pvinv_power_w"
                  seriesNameFormat: "Micro-onduleurs (AC)"

    # === Comparaison Quotidienne ===
    today_stat:
      kind: Panel
      spec:
        display:
          name: "Aujourd'hui (kWh)"
        plugin:
          kind: StatChart
          spec:
            value:
              calc: "lastNotNull"
            unit: "kwatth"
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: "max_over_time(solar_yield_kwh[24h])"

    yesterday_stat:
      kind: Panel
      spec:
        display:
          name: "Hier (kWh)"
        plugin:
          kind: StatChart
          spec:
            value:
              calc: "lastNotNull"
            unit: "kwatth"
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: "max_over_time(solar_yield_kwh[24h] offset 24h)"

    daily_variation_stat:
      kind: Panel
      spec:
        display:
          name: "Variation J / J-1 (%)"
        plugin:
          kind: StatChart
          spec:
            value:
              calc: "lastNotNull"
            unit: "percent"
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: "((max_over_time(solar_yield_kwh[24h]) - max_over_time(solar_yield_kwh[24h] offset 24h)) / max_over_time(solar_yield_kwh[24h] offset 24h)) * 100"

    daily_energy_bars:
      kind: Panel
      spec:
        display:
          name: "Production Journalière (30 derniers jours)"
        plugin:
          kind: TimeSeriesChart
          spec:
            visual:
              display: "bars"
              fillOpacity: 80
            yAxis:
              format:
                unit: "kwatth"
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: "max_over_time(solar_yield_kwh[1d])"
                  seriesNameFormat: "Production journalière"

    # === Comparaison Annuelle 5 Ans ===
    yearly_comparison:
      kind: Panel
      spec:
        display:
          name: "Production Journalière sur 5 Ans (Superposée)"
        plugin:
          kind: TimeSeriesChart
          spec:
            visual:
              display: "line"
              lineWidth: 2
              areaOpacity: 0
            yAxis:
              format:
                unit: "kwatth"
            legend:
              displayMode: "table"
              placement: "right"
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: "max_over_time(solar_yield_kwh[1d])"
                  seriesNameFormat: "Année N"
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: "max_over_time(solar_yield_kwh[1d] offset 365d)"
                  seriesNameFormat: "Année N-1"
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: "max_over_time(solar_yield_kwh[1d] offset 730d)"
                  seriesNameFormat: "Année N-2"
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: "max_over_time(solar_yield_kwh[1d] offset 1095d)"
                  seriesNameFormat: "Année N-3"
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: "max_over_time(solar_yield_kwh[1d] offset 1460d)"
                  seriesNameFormat: "Année N-4"

    annual_variation_stat:
      kind: Panel
      spec:
        display:
          name: "Variation Annuelle N vs N-1 (%)"
        plugin:
          kind: StatChart
          spec:
            value:
              calc: "lastNotNull"
            unit: "percent"
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: "((sum_over_time(max_over_time(solar_yield_kwh[1d])[365d:1d]) - sum_over_time(max_over_time(solar_yield_kwh[1d] offset 365d)[365d:1d])) / sum_over_time(max_over_time(solar_yield_kwh[1d] offset 365d)[365d:1d])) * 100"

  # === Layout (Grid) ===
  layouts:
    - kind: Grid
      spec:
        items:
          - x: 0
            y: 0
            width: 6
            height: 4
            content:
              $ref: "#/spec/panels/total_power_stat"

          - x: 6
            y: 0
            width: 6
            height: 4
            content:
              $ref: "#/spec/panels/mppt_power_stat"

          - x: 12
            y: 0
            width: 6
            height: 4
            content:
              $ref: "#/spec/panels/ac_power_stat"

          - x: 18
            y: 0
            width: 6
            height: 4
            content:
              $ref: "#/spec/panels/daily_yield_stat"

          - x: 0
            y: 4
            width: 24
            height: 8
            content:
              $ref: "#/spec/panels/power_timeseries"

          - x: 0
            y: 12
            width: 6
            height: 4
            content:
              $ref: "#/spec/panels/today_stat"

          - x: 6
            y: 12
            width: 6
            height: 4
            content:
              $ref: "#/spec/panels/yesterday_stat"

          - x: 12
            y: 12
            width: 6
            height: 4
            content:
              $ref: "#/spec/panels/daily_variation_stat"

          - x: 0
            y: 16
            width: 24
            height: 8
            content:
              $ref: "#/spec/panels/daily_energy_bars"

          - x: 0
            y: 24
            width: 24
            height: 10
            content:
              $ref: "#/spec/panels/yearly_comparison"

          - x: 0
            y: 34
            width: 12
            height: 4
            content:
              $ref: "#/spec/panels/annual_variation_stat"
