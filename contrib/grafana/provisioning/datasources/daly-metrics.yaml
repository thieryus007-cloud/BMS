apiVersion: 1

# Datasource Grafana qui interroge le backend metrics-store (redb) via
# daly-bms-server. VictoriaMetrics a été retiré (Phase 5) — redb est la
# seule TSDB de lecture du système.
#
# Les endpoints Prometheus-compat exposés par daly-bms-server (/api/v1/query,
# /api/v1/query_range, /api/v1/labels, /api/v1/series, /api/v1/label/:n/values,
# /-/healthy) lisent redb directement.

datasources:
  - name: Daly Metrics (redb)
    type: prometheus
    access: proxy
    url: http://127.0.0.1:8080
    uid: daly-metrics
    isDefault: true
    editable: true
    jsonData:
      httpMethod: GET
      timeInterval: 60s
      queryTimeout: 30s
      prometheusType: Prometheus
      prometheusVersion: 2.40.0
      manageAlerts: false
