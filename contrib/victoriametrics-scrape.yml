# Configuration de scrape pour VictoriaMetrics (vmagent ou VM intégré).
#
# Note : node_exporter a été retiré du projet — les métriques système
# sont désormais collectées directement par monitor.rs dans daly-bms-server
# (pi5_cpu_percent, pi5_load_1min, pi5_disk_percent, pi5_memory_percent).
#
# Ce fichier ne contient plus que la configuration globale ; ajouter ici
# d'éventuels nouveaux jobs de scrape externes (Mosquitto exporter,
# Victron exporter, etc.).
#
# Déploiement sur Pi5 :
#   sudo cp contrib/victoriametrics-scrape.yml /etc/victoriametrics/scrape.yml
#
# Puis redémarrer VictoriaMetrics avec :
#   -promscrape.config=/etc/victoriametrics/scrape.yml

global:
  scrape_interval: 60s
  scrape_timeout:  10s

scrape_configs: []
