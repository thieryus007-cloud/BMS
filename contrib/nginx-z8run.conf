# /etc/nginx/sites-available/z8run
# nginx sert le frontend statique sur le port 7700 et proxifie l'API
# vers z8run backend sur 127.0.0.1:7701 (port interne).
#
# Activer :
#   sudo ln -sf /etc/nginx/sites-available/z8run /etc/nginx/sites-enabled/z8run
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 7700;
    listen [::]:7700;

    access_log /var/log/nginx/z8run_access.log;
    error_log  /var/log/nginx/z8run_error.log warn;

    # Frontend React SPA
    location / {
        root /home/pi5compute/z8run/frontend/dist;
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "public";
    }

    # API REST + Auth + Hooks → z8run backend interne
    location ~ ^/(api|auth|hook)/ {
        proxy_pass http://127.0.0.1:7701;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }

    # WebSocket
    location /ws {
        proxy_pass http://127.0.0.1:7701;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    server_tokens off;
    add_header X-Content-Type-Options nosniff;
}
